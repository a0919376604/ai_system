[project]
name = "devsync"
version = "0.1.0"
description = "Sync-and-SSH wrapper around Mutagen for internal dev servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "leric" }]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
]

[project.scripts]
devsync = "devsync.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-mock>=3.12",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devsync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
