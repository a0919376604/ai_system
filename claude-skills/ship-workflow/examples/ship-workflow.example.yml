# Copy to ~/.claude/ship-workflow.yml and edit.

# Required
airos_vault: /Users/leric/Documents/SecondBrain

# Optional (defaults shown)
airos_projects_dir: "10 Projects"
code_root: /Users/leric/Desktop/code   # /ship-init <repo> resolves to <code_root>/<repo>
default_roadmap_mode: soft             # soft | strict
default_id_pad: 3                      # IDEA-001 vs IDEA-1
auto_pull_freshness_window: 60         # seconds; sync.sh skip threshold

# --- test budget (global multipliers; baseline is computed per-repo) ---------
# Baseline is this repo's own test:src line ratio, measured live, so these
# multipliers are portable across repos with different testing cultures.
# Shadow mode is DERIVED from docs/learnings/_log.md — do not add a counter here.
test_budget:
  major_multiplier: 2
  blocking_multiplier: 4
