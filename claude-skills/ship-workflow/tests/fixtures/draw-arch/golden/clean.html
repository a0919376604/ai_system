<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo 架構</title><style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:#cbd5e1;
font-family:'JetBrains Mono',SFMono-Regular,Menlo,'PingFang TC',monospace;font-size:13px}
main{max-width:1440px;margin:auto;padding:40px}h1{font-size:26px;color:#f8fafc}
h2{font-size:18px;color:#f8fafc}.sub,footer{color:#94a3b8;line-height:1.8}
section{margin:28px 0}svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0;font-size:11px}
.route{border-top:1px solid #1e293b;padding-top:16px}.steps{line-height:1.8;padding-left:30px}
.steps li{margin:12px 0}.steps span{display:block}.cond{width:100%;border-collapse:collapse;
margin:32px 0;line-height:1.8}th,td{border:1px solid #1e293b;padding:12px;text-align:left;
vertical-align:top;overflow-wrap:anywhere}th{color:#94a3b8}
.cond th:nth-child(1){width:17%}.cond th:nth-child(2){width:20%}.cond th:nth-child(4){width:24%}
.cond td:nth-child(1){overflow-wrap:normal;color:#f8fafc}.cond td:nth-child(4){font-size:11.5px;color:#94a3b8}.cond tr.warn td{color:#fb7185}tr.warn{color:#fb7185}
footer{border-top:1px solid #1e293b;padding-top:20px}a{color:#22d3ee}
.pack a{display:block;border:1px solid #1e293b;padding:20px;margin:16px 0;text-decoration:none}
.pack span{display:block;color:#94a3b8;margin-top:8px}
.pan-hint{display:none}
@media (max-width:700px){main{padding:16px}h1{font-size:20px}.sub{font-size:12px;overflow-wrap:anywhere}
.pan{overflow-x:auto;border:1px solid #1e293b;border-radius:8px}
.pan svg{width:calc(var(--w)*0.8);max-width:none}.pan-hint{display:block;color:#94a3b8;font-size:12px;margin:6px 0 8px}
table.cond,.cond thead,.cond tbody,.cond tr,.cond td{display:block}.cond thead{display:none}
.cond tr{border:1px solid #1e293b;border-radius:8px;margin:12px 0;padding:10px 12px}.cond td{border:0;padding:3px 0}
.cond td:nth-child(1){font-size:15px;font-weight:700;overflow-wrap:anywhere}.cond td:nth-child(2)::before{content:"做什麼　";color:#64748b}
.cond td:nth-child(3)::before{content:"條件　";color:#64748b}.cond td:nth-child(4){font-size:11px;overflow-wrap:anywhere}}
</style></head><body><main>
<h1>Demo 架構</h1>
<p class="sub">測試用 · demo · 0123456</p>
<section class="diagram">
<p class="pan-hint">← 左右滑動看整張圖 →</p><div class="pan"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Demo&#32;架構" style="--w:600px">
<defs>
<pattern id="demo-0-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
<marker id="demo-0-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="demo-0-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
</defs>
<rect width="100%" height="100%" fill="#020617"/>
<rect width="100%" height="100%" fill="url(#demo-0-grid)"/>
<rect x="10" y="10" width="580" height="120" rx="8" fill="none" stroke="#fbbf24" stroke-dasharray="8,4"/>
<text x="22" y="27" font-size="10" fill="#fbbf24" text-anchor="start">EKS</text>
<g data-edge="a->b" opacity="1">
<path d="M180&#32;70&#32;H300" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#demo-0-arrow)"/>
<rect x="225.0" y="52" width="30.0" height="16" rx="3" fill="#020617"/>
<text x="240" y="63.5" font-size="10" fill="#64748b" text-anchor="middle">寫入</text>
</g>
<g data-node="a" opacity="1">
<title>api/x.py:1-9</title>
<rect x="20" y="40" width="160" height="60" rx="6" fill="#0f172a"/>
<rect x="20" y="40" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="34" y="62" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="start">Webhook</text>
<text x="34" y="78" font-size="10" fill="#34d399" text-anchor="start">api/x.py</text>
<text x="34" y="99" font-size="10.5" fill="#fcd34d" text-anchor="start">條件：簽章不對 → 拒絕</text>
</g>
<g data-node="b" opacity="1">
<rect x="300" y="40" width="160" height="60" rx="6" fill="#0f172a"/>
<rect x="300" y="40" width="160" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="380" y="74" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>
</g>
</svg></div>
</section>
<div class="legend"><span style="color:#34d399">後端</span><span style="color:#a78bfa">資料庫</span></div>
<section class="route">

<p class="pan-hint">← 左右滑動看整張圖 →</p><div class="pan"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Demo&#32;架構" style="--w:600px">
<defs>
<pattern id="demo-r0-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
<marker id="demo-r0-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="demo-r0-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
</defs>
<rect width="100%" height="100%" fill="#020617"/>

<path d="M180&#32;70&#32;H300" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#demo-r0-amber)"/>
<rect x="225.0" y="52" width="30.0" height="16" rx="3" fill="#020617"/>
<text x="240" y="63.5" font-size="10" fill="#fbbf24" text-anchor="middle">寫入</text>
</g>
<g data-node="a" opacity="1">
<title>api/x.py:1-9</title>
<rect x="20" y="40" width="160" height="60" rx="6" fill="#0f172a"/>
<rect x="20" y="40" width="160" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="34" y="62" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="start">Webhook</text>
<text x="34" y="78" font-size="10" fill="#34d399" text-anchor="start">api/x.py</text>
<text x="34" y="99" font-size="10.5" fill="#fcd34d" text-anchor="start">條件：簽章不對 → 拒絕</text>
</g>
<g data-node="b" opacity="1">
<rect x="300" y="40" width="160" height="60" rx="6" fill="#0f172a"/>
<rect x="300" y="40" width="160" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="380" y="74" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">PostgreSQL</text>
</g>
<g class="badge"><circle cx="190" cy="40" r="11" fill="#fbbf24" stroke="#020617"/><text x="190" y="43.5" font-size="10" fill="#020617" text-anchor="middle">1</text></g>
</svg></div>
<ol class="steps">
<li>打 webhook<span style="color:#fcd34d">簽章不對就拒絕</span></li>
</ol>
</section>
<table class="cond">
<thead><tr><th>節點</th><th>做什麼</th><th>什麼條件走到這、離開時往哪</th><th>程式碼</th></tr></thead>
<tbody>

</table>

</main></body></html>
